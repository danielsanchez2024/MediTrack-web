server {
    listen       80;
    server_name  localhost;

    # This container sits behind another nginx (meditrack-infra) that listens on whatever public
    # host/port the stack is exposed on, and this one cannot know it. A request for /login makes
    # nginx redirect to /login/ (directory index) — as an absolute URL that would read
    # "http://localhost/login/", dropping the real port and sending the browser to a different
    # server. Relative redirects ("Location: /login/") keep the browser on the origin it used.
    absolute_redirect off;

    # Hashed build assets (Dashboard.B_Kr__tC.js, etc.) never change content once built — a
    # new build always gets new filenames — so browsers can cache them forever. This must
    # come before location / so it matches first for anything under /_astro/.
    location /_astro/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Same directory + index behavior as the stock nginx:alpine default.conf — only the added
    # header changes. Every HTML document must always be revalidated: it's what tells the
    # browser which hashed asset filenames currently exist right now. Without this, a browser
    # could keep serving a stale cached page referencing chunks a later deploy already
    # removed, producing 404s the moment it tries to load one (this is exactly what happened
    # after we redeployed this image a few times in a row during testing).
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        add_header Cache-Control "no-cache";
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
