name: Secret scan

# Fails the pipeline if a credential (API key, token, private key, .env value) is found in the
# code or in the git history. Runs on every PR and push.
on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan with gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.18.4 \
            detect --source /repo --redact --verbose --exit-code 1
